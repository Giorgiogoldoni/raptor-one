name: RAPTOR Chart Data
on:
  schedule:
    - cron: '0 7 * * 1-5'
  workflow_dispatch:
jobs:
  fetch-charts:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installa dipendenze
        run: pip install yfinance
      - name: Rimuovi vecchio raptor_chart.json monolitico (se presente)
        run: git rm -f --ignore-unmatch raptor_chart.json
      - name: Esegui RAPTOR Chart Fetch
        run: python raptor_chart_fetch.py
      - name: Commit e push data/charts/
        run: |
          git config user.name  "RAPTOR Bot"
          git config user.email "raptor-bot@noreply.github.com"
          git add -A data/charts/ raptor_chart.json
          git diff --staged --quiet || (git commit -m "📈 RAPTOR chart data $(date +'%d/%m/%Y %H:%M')" && git pull --rebase origin main && git push)
